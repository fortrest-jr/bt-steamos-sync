[project]
name = "bt-steamos-sync"
version = "0.1.0"
description = "Copy Bluetooth pairings from SteamOS to this Linux install on a dual-boot Steam Deck"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "fortrest", email = "30597575+fortrest-jr@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["bluetooth", "bluez", "steamos", "steam-deck", "dual-boot", "pairing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "questionary>=2.1.1",
]

[project.urls]
Repository = "https://github.com/fortrest-jr/bt-steamos-sync"
Issues = "https://github.com/fortrest-jr/bt-steamos-sync/issues"

[project.scripts]
bt-sync = "bt_steamos_sync.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
